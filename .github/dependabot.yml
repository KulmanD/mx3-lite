version: 2

updates:
  # Group routine action updates while keeping major upgrades separate for review.
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "main"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Jerusalem"
    open-pull-requests-limit: 2
    rebase-strategy: "disabled"
    groups:
      non-major-actions:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    commit-message:
      prefix: "ci"
      include: "scope"

  # This remains quiet until an external Swift package dependency is added.
  - package-ecosystem: "swift"
    directory: "/"
    target-branch: "main"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:15"
      timezone: "Asia/Jerusalem"
    open-pull-requests-limit: 1
    rebase-strategy: "disabled"
    groups:
      non-major-swift:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    commit-message:
      prefix: "build"
      include: "scope"
